name: Deploy Microservices to AWS ECS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_REPOSITORY: microservice
  ECS_CLUSTER: microservice-cluster
  ENVIRONMENT: production

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build-image.outputs.image }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        IMAGE_TAG: ${{ github.sha }}
      run: |
        # Build Docker image
        cd micro-services
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
        
        # Push image to ECR
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
        
        # Output image URI
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

  deploy-tasks:
    name: Deploy Task ${{ matrix.task }}
    needs: build-and-push
    strategy:
      matrix:
        task: [task1, task2, task3, task4, task5, task6, task7]
      fail-fast: false
    uses: ./.github/workflows/deploy-common.yml
    with:
      environment: ${{ vars.ENVIRONMENT || 'production' }}
      aws-region: ${{ vars.AWS_REGION || 'ap-northeast-1' }}
      images: |
        microservice-container: ${{ needs.build-and-push.outputs.image }}
      task-definition-base-path: micro-services/task_definitions/${{ matrix.task }}
      cluster: ${{ vars.ECS_CLUSTER || 'microservice-cluster' }}
    secrets:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}